<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CivicFix — Report a dangerous civic issue in India</title>
    <meta
      name="description"
      content="Describe a pothole, open drain or exposed wire in your own language. CivicFix identifies the responsible department, drafts the complaint, and tracks it until it's fixed. Independent prototype."
    />

    <!--
      TODO before submission: replace PUBLIC_ORIGIN_PLACEHOLDER below with the real
      deployed origin (e.g. https://civicfix.vercel.app). Social crawlers do not run
      JavaScript, so these absolute URLs cannot be patched at runtime.
    -->

    <!-- Open Graph (default — overridden dynamically on detail pages) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CivicFix" />
    <meta property="og:title" content="CivicFix — Report a dangerous civic issue in India" />
    <meta
      property="og:description"
      content="Describe the problem in one sentence, in your own language. We find the right department, write the complaint, and keep a clock on it until it's fixed."
    />
    <meta property="og:url" content="PUBLIC_ORIGIN_PLACEHOLDER" />
    <meta property="og:image" content="PUBLIC_ORIGIN_PLACEHOLDER/api/og?type=hazard&title=CivicFix&city=India&state=&negligence=&severity=&agency=Report+a+civic+issue&status=Reported" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CivicFix — Report a dangerous civic issue in India" />
    <meta
      name="twitter:description"
      content="Describe the problem in one sentence, in your own language. We find the right department, write the complaint, and keep a clock on it until it's fixed."
    />
    <meta name="twitter:image" content="PUBLIC_ORIGIN_PLACEHOLDER/api/og?type=hazard&title=CivicFix&city=India&state=&negligence=&severity=&agency=Report+a+civic+issue&status=Reported" />

    <!-- Inline SVG favicon: avoids a 404 without shipping a binary asset -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Cpath d='M16 5 3 28h26L16 5z' fill='none' stroke='%23D90429' stroke-width='3'/%3E%3Crect x='14.5' y='13' width='3' height='7' fill='%23D90429'/%3E%3Crect x='14.5' y='22' width='3' height='3' fill='%23D90429'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
